<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>HookScore</title>
  <style>
    body {
      width: 260px;
      font-family: system-ui, -apple-system, sans-serif;
      margin: 0;
      padding: 15px;
      background-color: #f9f9f9;
      color: #333;
    }
    h2 {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 16px;
      margin-top: 0;
      color: #ff0000;
    }
    h2 img {
      width: 28px;
      height: 28px;
      border-radius: 7px;
    }
    button {
      width: 100%;
      border: 0;
      border-radius: 6px;
      padding: 10px 12px;
      background: #ff0000;
      color: #fff;
      cursor: pointer;
      font-weight: 700;
    }
    p {
      font-size: 12px;
      color: #666;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <h2><img src="icons/icon-48.png" alt="">HookScore</h2>
  <p>Score your Short's hook before you post.</p>
  <button id="open-analyzer" type="button">Open Analyzer</button>
  <script src="popup.js"></script>
</body>
</html>
